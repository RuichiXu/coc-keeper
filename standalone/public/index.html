<script>
window.__ModuleLoader__ = {
  load: function (mod) {
    var exports = mod.factory(function () { throw new Error("require not supported"); });
    exports.apply({
      effect: function (onDispose) {
        window.addEventListener("pagehide", onDispose, { once: true });
      }
    });
  }
};
</script>
